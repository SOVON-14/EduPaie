[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edupaie"
version = "0.1.0"
description = "Gestion des frais de scolarité"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.2",
    "reportlab==5.0.1",
    "python-docx==1.2.0",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

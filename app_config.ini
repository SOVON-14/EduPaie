[APP]
name = EduPaie
version = 1.0.0
display_name = EduPaie - Gestion des frais de scolarité

[DATABASE]
# Chemin de la base de données (relatif ou absolu)
# Si vide, utilise le chemin par défaut (data/edupaie.db en dev, %LOCALAPPDATA%/EduPaie/edupaie.db en prod)
path = 

[RECEIPTS]
# Dossier pour les reçus PDF générés
# Si vide, utilise le chemin par défaut (receipts/ en dev, %LOCALAPPDATA%/EduPaie/receipts en prod)
path = 

[CURRENCY]
# Devise utilisée
code = FCFA
# Plafond maximum pour les montants
max_amount = 1000000
# Suffixe pour l'affichage
suffix =  FCFA

[CLASSES]
# Liste des classes par défaut (Collège et Lycée)
college = 6ème A,6ème B,6ème C,5ème A,5ème B,5ème C,4ème A,4ème B,4ème C,3ème A,3ème B,3ème C
lycee = 2nde A,2nde B,2nde C,1ère A,1ère B,1ère C,Terminale A,Terminale B,Terminale C

[PAYMENT_MODES]
# Modes de paiement acceptés
modes = especes,cheque,virement,mobile_money

[SECURITY]
# Activer l'authentification par mot de passe
auth_enabled = true
# Nombre d'itérations pour le hachage du mot de passe
password_iterations = 200000

[LOGGING]
# Niveau de logging (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Format des logs
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
